name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # The old `tools` package is gone from the SDK repo; installing it
          # fails sdkmanager. Platform-tools is enough — the next step pulls
          # platforms and build-tools.
          packages: platform-tools

      - name: Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Install JS deps
        run: npm ci

      - name: Bundle the field kit
        run: npm run build:android

      - name: Sync into Android
        run: npx cap sync android

      - name: Assemble release APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/SURVBOX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SURVBOX-apk
          path: dist-apk/SURVBOX.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(gh release view --json tagName --jq .tagName)"
          fi
          gh release upload "$TAG" dist-apk/SURVBOX.apk --clobber
