name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Install JS deps
        run: npm ci

      - name: Bundle the field kit
        run: npm run build:android

      - name: Sync into Android
        run: npx cap sync android

      - name: Assemble release APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/SURVBOX.apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist-apk/SURVBOX-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SURVBOX-apk
          path: dist-apk/SURVBOX.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-apk/SURVBOX.apk "dist-apk/SURVBOX-${TAG}.apk" --clobber
          else
            gh release create "$TAG" dist-apk/SURVBOX.apk "dist-apk/SURVBOX-${TAG}.apk" \
              --title "SURVBOX ${TAG}" \
              --notes "Android APK for this tag. Sideload SURVBOX.apk. Allow the source when Android asks. Play Protect may warn because this is not a Play Store build."
          fi
